name: CI

# main へのプッシュとプルリクエストのたびに、書き方のチェック・整形のチェック・ビルド（型チェックを含む）を行う
# デプロイは Vercel が GitHub と連携して自動で行うので、ここではしない
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 手元の既定（Volta の Node 24）に合わせる
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        # 警告（使っていない変数や import など）が1つでもあれば失敗にする
        run: npm run lint -- --max-warnings=0

      - name: Check formatting (Prettier)
        run: npm run lint:prettier

      - name: Build (Next.js, type check included)
        run: npm run build
